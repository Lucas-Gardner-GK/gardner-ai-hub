<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP Servers - Business Future</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; overflow: hidden; background: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 30px 30px 70px; }
  .slide { max-width: 100%; max-height: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.6); border-radius: 6px; display: none; user-select: none; -webkit-user-drag: none; }
  .slide.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: scale(1); } }
  #controls { position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.4) 70%, transparent); display: flex; align-items: center; justify-content: center; gap: 16px; padding: 0 20px; z-index: 10; transition: opacity .3s; }
  #controls.hidden { opacity: 0; pointer-events: none; }
  button { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.15); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: background .15s; }
  button:hover { background: rgba(255,255,255,.2); }
  button:active { transform: scale(.96); }
  #counter { font-variant-numeric: tabular-nums; font-size: 14px; opacity: .85; min-width: 50px; text-align: center; }
  .nav-zone { position: fixed; top: 0; bottom: 56px; width: 25%; cursor: pointer; z-index: 5; }
  .nav-zone.left { left: 0; }
  .nav-zone.right { right: 0; }
  #overview { position: fixed; inset: 0; background: rgba(0,0,0,.96); display: none; padding: 40px; overflow-y: auto; z-index: 20; }
  #overview.show { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; align-content: start; }
  #overview img { width: 100%; border-radius: 4px; border: 2px solid transparent; cursor: pointer; transition: border-color .15s, transform .15s; }
  #overview img:hover { border-color: #fff; transform: scale(1.03); }
  #help { position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,.7); padding: 12px 16px; border-radius: 8px; font-size: 12px; line-height: 1.6; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 280px; z-index: 15; }
  #help.show { opacity: 1; }
  kbd { background: rgba(255,255,255,.15); padding: 1px 6px; border-radius: 3px; font-family: monospace; font-size: 11px; }
</style>

  <div id="controls">
    <button onclick="prev()">&larr; Prev</button>
    <span id="counter">1 / 7</span>
    <button onclick="next()">Next &rarr;</button>
    <button onclick="toggleOverview()">Overview</button>
    <button onclick="toggleFullscreen()">Fullscreen</button>
    <button onclick="toggleHelp()">?</button>
  </div>
  <div id="overview"></div>
  <div id="help">
    <strong>Keyboard shortcuts</strong><br>
    <kbd>&rarr;</kbd> / <kbd>Space</kbd> Next slide<br>
    <kbd>&larr;</kbd> Previous slide<br>
    <kbd>Home</kbd> / <kbd>End</kbd> First / last<br>
    <kbd>F</kbd> Fullscreen<br>
    <kbd>O</kbd> / <kbd>Esc</kbd> Overview<br>
    <kbd>?</kbd> Toggle this help
  </div>

<script>
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  let current = 0;
  const counter = document.getElementById('counter');
  const overview = document.getElementById('overview');
  const help = document.getElementById('help');
  const controls = document.getElementById('controls');
  let hideTimer;

  function show(i) {
    current = Math.max(0, Math.min(total - 1, i));
    slides.forEach((s, idx) => s.classList.toggle('active', idx === current));
    counter.textContent = (current + 1) + ' / ' + total;
  }
  function next() { show(current + 1); }
  function prev() { show(current - 1); }
  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
  function toggleOverview() {
    overview.classList.toggle('show');
    if (overview.classList.contains('show') && !overview.dataset.built) {
      slides.forEach((s, idx) => {
        const img = document.createElement('img');
        img.src = s.src;
        img.onclick = () => { show(idx); overview.classList.remove('show'); };
        overview.appendChild(img);
      });
      overview.dataset.built = '1';
    }
  }
  function toggleHelp() { help.classList.toggle('show'); }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(total - 1);
    else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    else if (e.key === 'o' || e.key === 'O') toggleOverview();
    else if (e.key === 'Escape' && overview.classList.contains('show')) overview.classList.remove('show');
    else if (e.key === '?' || e.key === '/') toggleHelp();
  });

  // Touch swipe
  let touchStart = null;
  document.addEventListener('touchstart', e => { touchStart = e.touches[0].clientX; });
  document.addEventListener('touchend', e => {
    if (touchStart === null) return;
    const dx = e.changedTouches[0].clientX - touchStart;
    if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
    touchStart = null;
  });

  // Auto-hide controls
  function resetHideTimer() {
    controls.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => controls.classList.add('hidden'), 3000);
  }
  document.addEventListener('mousemove', resetHideTimer);
  document.addEventListener('keydown', resetHideTimer);
  resetHideTimer();

  show(0);
</script>
